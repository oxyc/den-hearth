name: ci

# Every exact main commit produces a scanned, probed, immutable candidate image while its checks run. A release
# tag only promotes that already-tested digest (docker-publish.yml); it never recompiles or reruns this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR revisions are disposable. A main SHA is a potential release and its candidate must finish even
  # when another merge follows it, otherwise a tag could name a commit whose exact image was cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-hearth
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/den-hearth-controller

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Release helper
        run: scripts/release-test.sh
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The #[ignore]d Remux tests run real ffmpeg; the e2e job runs them with the image's own. nextest runs each
      # test in its own process and kills one that hangs (.config/nextest.toml) instead of stalling the job.
      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Doc tests
        run: cargo test --workspace --locked --doc
      - name: Test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      # Each benchmark once, so a bench that no longer builds or panics fails here rather than at measuring time.
      - name: Benchmarks run once
        run: bench/micro.sh --test
        env:
          CARGO_PROFILE_BENCH_LTO: "false"
          CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
      - name: Load harness checks
        run: python3 bench/http/test.py
      - name: Apple TV controller tests
        run: |
          python3 -m pip install uv==0.11.28
          uv sync --directory controller --locked --all-groups
          uv run --directory controller python -m unittest discover -s tests -v
      # Reel's two resident resolvers. The python one against a stub yt-dlp; the youtubei.js one with the deno the
      # image pins (checked against the Dockerfile's own sum) and the packages its lockfile pins.
      - name: Reel's yt-dlp worker tests
        run: python3 crates/reel/worker/test_resolve.py
      - name: Install the pinned deno
        run: |
          bash .github/scripts/install-pinned-deno.sh Dockerfile "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Reel's youtubei.js worker tests
        working-directory: crates/reel/worker/youtubei
        env:
          DENO_DIR: ${{ runner.temp }}/deno
        run: deno test --frozen --config=deno.json --lock=deno.lock .

  # Remux's #[ignore]d end-to-end tests, in the Dockerfile's e2e stage: the ffmpeg the image ships, because another
  # version seeks differently and the segment alignment depends on exactly how it seeks. The stage builds no
  # release binary, and its own cache scope (docker-bake.hcl) keeps it from racing the image build's.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: End-to-end tests
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: e2e

  controller-image:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build Apple TV controller image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: controller
          set: |
            controller.platform=linux/amd64
            controller.output=type=cacheonly

  # On a PR (e.g. a yt-dlp or dependency bump) — build the image WITHOUT pushing. This is the merge gate for the
  # checksummed downloads (yt-dlp, deno), the pinned GPAC commit and the checksummed ffmpeg source: a bad checksum
  # or a configure line that no longer builds fails the check. amd64, the only arch the box runs. It reads main's
  # cache but deliberately neither pushes an image nor overwrites the durable release cache with an unmerged
  # revision.
  # Note: this proves the image builds, NOT that YouTube extraction still works (that canary
  # can't run on datacenter IPs) — extraction breakage is caught operationally via /health.
  build-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read release metadata
        id: source
        run: bash .github/scripts/release-metadata.sh version >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image (no push)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            *.output=type=cacheonly

  # Main builds, probes and scans immutable Hearth and controller candidates while the other jobs run. They are
  # intentionally unsigned and never receive :latest here; docker-publish promotes this exact pair only after CI.
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Trivy's report goes to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: bash .github/scripts/release-metadata.sh version >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and push the candidate
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: hearth,controller
          push: true
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            hearth.tags=${{ env.IMAGE }}:candidate-${{ github.sha }}
            controller.tags=${{ env.CONTROLLER_IMAGE }}:candidate-${{ github.sha }}
            hearth.cache-to=type=gha,mode=max,scope=release-image
            controller.cache-to=type=gha,mode=max,scope=controller-release-image
      - name: Record candidate digests
        id: image
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: bash .github/scripts/release-metadata.sh bake-digests >> "$GITHUB_OUTPUT"
      # Served without a TMDB key or a cache, so it proves the image starts, all three services answer through
      # their prefixes, and each reports the release the VERSION file names.
      - name: Prove the image reports its release version
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.source.outputs.version }}
        run: scripts/probe-image.sh "$IMAGE@$DIGEST" "$VERSION"
      - name: Prove the controller candidate starts
        env:
          DIGEST: ${{ steps.image.outputs.controller_digest }}
        run: docker run --rm "$CONTROLLER_IMAGE@$DIGEST" health | jq -e '.running == false and .edgeConnected == false'
      # One scan, of fixable HIGH and CRITICAL findings, which the report and the gate below both read.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan controller image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CONTROLLER_IMAGE }}@${{ steps.image.outputs.controller_digest }}
          version: v0.74.0
          format: json
          output: trivy-controller.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # Gate: a CRITICAL with a fixed version available fails here, before the digest is recorded, so no tag can
      # promote it. Unfixed CVEs are ignored. A finding that does not apply goes in .trivyignore with a reason.
      - name: Scan gate
        run: bash .github/scripts/image-scan-results.sh candidate trivy.json
      - name: Controller scan gate
        run: bash .github/scripts/image-scan-results.sh candidate trivy-controller.json
      - name: Bind this CI run to its candidate digests
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          CONTROLLER_DIGEST: ${{ steps.image.outputs.controller_digest }}
        run: |
          jq -n --arg image "$DIGEST" --arg controller "$CONTROLLER_DIGEST" \
            '{image: $image, controller: $controller}' > candidate-digest.json
      - name: Save candidate identity for release promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-digest.json
          if-no-files-found: error
          retention-days: 30
      # Report: advisory, it never fails the job.
      - name: Report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload scan to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # A code-scanning outage must not hold a release.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Controller report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy-controller.sarif trivy-controller.json
      - name: Upload controller scan to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        continue-on-error: true
        with:
          sarif_file: trivy-controller.sarif
          category: trivy-controller-image
