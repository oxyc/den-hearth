name: ci

# Every exact main commit produces a scanned, probed, immutable candidate image while its checks run. A release
# tag only promotes that already-tested digest (docker-publish.yml); it never recompiles or reruns this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Superseded PR revisions are disposable. A main SHA is a potential release and its candidate must finish even
  # when another merge follows it, otherwise a tag could name a commit whose exact image was cancelled midway.
  # Main therefore gets one group per SHA: within a shared group GitHub keeps one running and one pending run and
  # cancels the older pending run when a third queues, even with cancel-in-progress off.
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-hearth
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/den-hearth-controller

jobs:
  # Test a source tree once. When a ci.yml run in this repository already passed every blocking test job on
  # byte-identical source (the commit's tree without VERSION; see scripts/ci-verdict.sh), the tests are skipped and
  # the `test` gate accepts that. That covers a merge commit whose PR run tested the same merge result, and
  # release.sh's version commit, whose predecessor tested the same source. The candidate job still builds, probes and
  # scans an image for every main SHA, so its version, revision label and digests are that commit's.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_changed: ${{ steps.diff.outputs.source_changed }}
      stack_due: ${{ steps.stack.outputs.due }}
      tree: ${{ steps.diff.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The cross-repo playback e2e is decided apart from reuse: its result depends on den-edge's latest release as
      # well as on this tree, so a verdict recorded for the same tree against another release proves nothing about
      # this one. It runs on every main commit (each is a release candidate, VERSION-only ones included) and on a pull
      # request touching what a play crosses.
      - name: Is the playback e2e due?
        id: stack
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          if grep -Eq '^(crates/hearth/src/(playback|guest|den|scout|stub|inproc|route|application)\.rs$|crates/remux/|crates/scout/src/(managed_hls|managed_subtitles|play|handler|stores/torbox)|crates/subtitles/|Cargo\.lock$|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Look for a recorded pass on this source
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tree=$(scripts/ci-verdict.sh tree HEAD)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Main SHAs run side by side, so a version commit's predecessor may still be testing the same source: wait
          # for its verdict rather than test it a second time. Any other change looks once and otherwise runs in full.
          before_tree=""
          if [ "$EVENT" = push ]; then
            before_tree=$(scripts/ci-verdict.sh tree "$BEFORE" 2>/dev/null || true)
          fi
          run=""
          for _ in $(seq 1 90); do
            run=$(scripts/ci-verdict.sh find "$REPO" "$tree")
            [ -z "$run" ] && [ "$before_tree" = "$tree" ] || break
            pending=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&head_sha=$BEFORE" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            [ "$pending" -gt 0 ] || break
            sleep 20
          done
          if [ -n "$run" ]; then
            url="https://github.com/$REPO/actions/runs/$run"
            echo "::notice title=Tests reused::source tree $tree already passed in $url"
            echo "Tests skipped: source tree \`$tree\` already passed in $url" >> "$GITHUB_STEP_SUMMARY"
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: scope
    if: needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Release helper
        run: scripts/release-test.sh
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The #[ignore]d Remux tests run real ffmpeg; the e2e job runs them with the image's own. nextest runs each
      # test in its own process and kills one that hangs (.config/nextest.toml) instead of stalling the job.
      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Doc tests
        run: cargo test --workspace --locked --doc
      - name: Test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      # Each benchmark once, so a bench that no longer builds or panics fails here rather than at measuring time.
      - name: Benchmarks run once
        run: bench/micro.sh --test
        env:
          CARGO_PROFILE_BENCH_LTO: "false"
          CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
      - name: Load harness checks
        run: python3 bench/http/test.py
      - name: Apple TV controller tests
        run: |
          python3 -m pip install uv==0.11.28
          uv sync --directory controller --locked --all-groups
          uv run --directory controller python -m unittest discover -s tests -v
      # Reel's two resident resolvers. The python one against a stub yt-dlp; the youtubei.js one with the deno the
      # image pins (checked against the Dockerfile's own sum) and the packages its lockfile pins.
      - name: Reel's yt-dlp worker tests
        run: python3 crates/reel/worker/test_resolve.py
      - name: Install the pinned deno
        run: |
          bash .github/scripts/install-pinned-deno.sh Dockerfile "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Reel's youtubei.js worker tests
        working-directory: crates/reel/worker/youtubei
        env:
          DENO_DIR: ${{ runner.temp }}/deno
        run: deno test --frozen --config=deno.json --lock=deno.lock .

  # Remux's #[ignore]d end-to-end tests, in the Dockerfile's e2e stage: the ffmpeg the image ships, because another
  # version seeks differently and the segment alignment depends on exactly how it seeks. The stage builds no
  # release binary, and its own cache scope (docker-bake.hcl) keeps it from racing the image build's.
  e2e:
    needs: scope
    if: needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: End-to-end tests
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: e2e

  # Playback through the real den-hearth (this commit, its `stub-upstreams` build) and the real den-edge (its latest
  # release), driven through den-edge's web app with fakes only at the outside edges. The suite and its runner live in
  # den-edge (`web/e2e-stack/`). It never takes a reused verdict (see `scope`), and the `test` gate requires it
  # wherever it was due, so `scripts/release.sh` tags only a main commit it passed on.
  stack-e2e:
    name: Playback with den-edge
    needs: scope
    if: needs.scope.outputs.stack_due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      edge: ${{ steps.edge.outputs.tag }}
    steps:
      # Beside den-edge's checkout, not around it: nested, Cargo takes den-edge for a member of this workspace.
      - uses: actions/checkout@v7
        with:
          path: den-hearth
      # den-edge's latest release, the one the box runs. Until a release carries the suite, its main, or a pull
      # request's paired den-edge branch of the same name.
      - name: Check out den-edge's latest release
        id: edge
        env:
          PAIRED: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/oxyc/den-edge.git den-edge
          has() { git -C den-edge cat-file -e "$1:web/e2e-stack/ci.sh" 2>/dev/null; }
          ref=$(git -C den-edge for-each-ref --count=1 --sort=-v:refname --format='%(refname:short)' 'refs/tags/v*')
          if [ -z "$ref" ] || ! has "$ref"; then
            echo "::warning::no den-edge release carries web/e2e-stack yet"
            ref=origin/main
            if ! has "$ref" && [ -n "$PAIRED" ] && has "origin/$PAIRED"; then ref="origin/$PAIRED"; fi
          fi
          has "$ref" || { echo "::error::no den-edge ref carries web/e2e-stack"; exit 1; }
          git -C den-edge checkout --quiet "$ref"
          echo "tag=${ref#origin/}@$(git -C den-edge rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            den-hearth
            den-edge
          key: stack-e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: den-edge/web/package-lock.json
      - name: Playback through den-hearth and den-edge ${{ steps.edge.outputs.tag }}
        run: den-edge/web/e2e-stack/ci.sh den-edge den-hearth
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stack-e2e-failures
          path: den-edge/web/test-results-stack
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing required `test` status while the Rust/Python checks and the e2e stage run as separate
  # jobs that a recorded pass can skip. A failed or skipped scope must not read as a pass. The playback e2e is never
  # reused: wherever it was due it must have run and passed in this run.
  test:
    needs: [scope, checks, e2e, stack-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the playback e2e with den-edge wherever it was due
        env:
          STACK_DUE: ${{ needs.scope.outputs.stack_due }}
          STACK: ${{ needs.stack-e2e.result }}
        run: |
          if [ "$STACK_DUE" = true ]; then test "$STACK" = success; else test "$STACK" = skipped; fi
      - name: Require every test job, or a recorded pass
        env:
          SOURCE_CHANGED: ${{ needs.scope.outputs.source_changed }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          if [ "$SOURCE_CHANGED" = false ]; then
            test "$CHECKS" = skipped && test "$E2E" = skipped
          else
            test "$CHECKS" = success && test "$E2E" = success
          fi

  # Record that this exact source tree passed every blocking job, for a later run on byte-identical source. Only a
  # run that actually tested it records one; a PR's verdict also needs its image builds to have succeeded.
  # The playback e2e is recorded beside the tree (`stack`: the den-edge it ran against, or `not-run`) but never reused
  # from it (see `scope`).
  verdict:
    needs: [scope, checks, e2e, controller-image, build-pr, stack-e2e]
    if: >-
      always() && needs.scope.outputs.source_changed == 'true' && needs.checks.result == 'success'
      && needs.e2e.result == 'success'
      && (needs.stack-e2e.result == 'success' || needs.stack-e2e.result == 'skipped')
      && (needs.build-pr.result == 'success' || (github.event_name == 'push' && needs.build-pr.result == 'skipped'))
      && (needs.controller-image.result == 'success' || (github.event_name == 'push' && needs.controller-image.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Write the verdict
        env:
          TREE: ${{ needs.scope.outputs.tree }}
          EVENT: ${{ github.event_name }}
          STACK: ${{ needs.stack-e2e.result == 'success' && needs.stack-e2e.outputs.edge || 'not-run' }}
        run: |
          jq -n --arg tree "$TREE" --arg sha "$GITHUB_SHA" --arg event "$EVENT" --arg run "$GITHUB_RUN_ID" \
            --arg stack "$STACK" '{tree: $tree, sha: $sha, event: $event, run: $run, stack: $stack}' > verdict.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-verdict-${{ needs.scope.outputs.tree }}
          path: verdict.json
          if-no-files-found: error
          retention-days: 14

  controller-image:
    needs: scope
    if: >-
      needs.scope.outputs.source_changed == 'true'
      && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build Apple TV controller image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: controller
          set: |
            controller.platform=linux/amd64
            controller.output=type=cacheonly

  # On a PR (e.g. a yt-dlp or dependency bump) — build the image WITHOUT pushing. This is the merge gate for the
  # checksummed downloads (yt-dlp, deno), the pinned GPAC commit and the checksummed ffmpeg source: a bad checksum
  # or a configure line that no longer builds fails the check. amd64, the only arch the box runs. It reads main's
  # cache but deliberately neither pushes an image nor overwrites the durable release cache with an unmerged
  # revision.
  # Note: this proves the image builds, NOT that YouTube extraction still works (that canary
  # can't run on datacenter IPs) — extraction breakage is caught operationally via /health.
  build-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read release metadata
        id: source
        run: bash .github/scripts/release-metadata.sh version >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image (no push)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            *.output=type=cacheonly

  # Main builds, probes and scans immutable Hearth and controller candidates while the other jobs run. They are
  # intentionally unsigned and never receive :latest here; docker-publish promotes this exact pair only after CI.
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Trivy's report goes to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: bash .github/scripts/release-metadata.sh version >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and push the candidate
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: hearth,controller
          push: true
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            hearth.tags=${{ env.IMAGE }}:candidate-${{ github.sha }}
            controller.tags=${{ env.CONTROLLER_IMAGE }}:candidate-${{ github.sha }}
            hearth.cache-to=type=gha,mode=max,scope=release-image
            controller.cache-to=type=gha,mode=max,scope=controller-release-image
      - name: Record candidate digests
        id: image
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: bash .github/scripts/release-metadata.sh bake-digests >> "$GITHUB_OUTPUT"
      # Served without a TMDB key or a cache, so it proves the image starts, all three services answer through
      # their prefixes, and each reports the release the VERSION file names.
      - name: Prove the image reports its release version
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.source.outputs.version }}
        run: scripts/probe-image.sh "$IMAGE@$DIGEST" "$VERSION"
      - name: Prove the controller candidate starts
        env:
          DIGEST: ${{ steps.image.outputs.controller_digest }}
        run: docker run --rm "$CONTROLLER_IMAGE@$DIGEST" health | jq -e '.running == false and .edgeConnected == false'
      # One scan, of fixable HIGH and CRITICAL findings, which the report and the gate below both read.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan controller image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CONTROLLER_IMAGE }}@${{ steps.image.outputs.controller_digest }}
          version: v0.74.0
          format: json
          output: trivy-controller.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # Gate: a CRITICAL with a fixed version available fails here, before the digest is recorded, so no tag can
      # promote it. Unfixed CVEs are ignored. A finding that does not apply goes in .trivyignore with a reason.
      - name: Scan gate
        run: bash .github/scripts/image-scan-results.sh candidate trivy.json
      - name: Controller scan gate
        run: bash .github/scripts/image-scan-results.sh candidate trivy-controller.json
      - name: Bind this CI run to its candidate digests
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          CONTROLLER_DIGEST: ${{ steps.image.outputs.controller_digest }}
        run: |
          jq -n --arg image "$DIGEST" --arg controller "$CONTROLLER_DIGEST" \
            '{image: $image, controller: $controller}' > candidate-digest.json
      - name: Save candidate identity for release promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-digest.json
          if-no-files-found: error
          retention-days: 30
      # Report: advisory, it never fails the job.
      - name: Report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload scan to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        # A code-scanning outage must not hold a release.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Controller report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy-controller.sarif trivy-controller.json
      - name: Upload controller scan to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: trivy-controller.sarif
          category: trivy-controller-image
