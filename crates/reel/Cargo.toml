[package]
name = "den-reel"
# Not the release number: that is the VERSION file, which the image carries as DEN_VERSION. This stays put so a
# release does not change the manifest the Docker dependency layer is keyed on. The fallback for dev builds.
version = "0.56.0"
edition = "2021"
description = "Den trailers, one container: addon (imdb→ytId via TMDB) + yt-dlp/ffmpeg proxy (ytId→faststart MP4) for inline tvOS playback"
publish = false
license = "MIT"

[dependencies]
# The sealed-config keyring and the install-revocation policy, shared with Scout and Subtitles.
den-seal = { path = "../seal" }
# Response builders, conditional GETs, CORS, the request log line and the metrics bearer check, shared with Subtitles and Remux.
den-http = { path = "../http" }
# Client profiles, Retry-After and the per-credential pause, shared with Subtitles, Remux and Scout.
den-upstream = { path = "../upstream" }
# Single-threaded async runtime — this is an I/O-bound proxy; the CPU work lives in the
# yt-dlp/ffmpeg subprocesses, not here. current_thread keeps the resident thread count (and RAM)
# minimal on a homelab box.
tokio = { version = "1", features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (not OpenSSL) with bundled webpki roots → no ca-certificates package needed at runtime,
# and a static-friendly TLS stack for a slim image.
# http2: manifest.googlevideo.com speaks it, so the HLS playlists /hls and /m/ fetch share a connection.
# The rr*.googlevideo.com media hosts do not (they answer HTTP/1.1 even when h2 is offered, checked with curl
# from the box on 2026-09-15), so it does nothing for /progressive's index or its body.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
tokio-util = { version = "0.7", features = ["io"] }
# Only need Shared/FutureExt/TryStreamExt — skip the sink/io/compat machinery in the defaults.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"
base64 = "0.23"
# Keyed BLAKE2b for the optional /play + /crop URL signature (PLAY_SECRET), and a constant-time
# compare for checking it. Both are ALREADY in the tree — crypto_box (under den-seal) uses blake2 for the
# seal nonce and subtle throughout — so these edges add a direct dependency, not a new crate to compile.
blake2 = "0.10"
subtle = "2"
# HTTP dates for /play's Last-Modified, If-Modified-Since and If-Range. hyper already builds it for
# the Date header, so this too is a direct edge rather than new code.
httpdate = "1"

[features]
# Forwards to the private modules' hot paths for benches/reel.rs (src/bench_api.rs). Off in every build that ships.
bench = []

[[bench]]
name = "reel"
harness = false
required-features = ["bench"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync", "test-util"] }
# Benchmarks, with an allocation-counting global allocator (`bench/micro.sh`).
divan = "0.1"

# killpg: kill_on_drop reaps only the direct child, and yt-dlp forks ffmpeg to do the merge.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
