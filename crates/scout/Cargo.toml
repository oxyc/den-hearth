[package]
name = "den-scout"
version = "0.0.0"
edition = "2021"
description = "Port of den-scout's internal/scout (Go) to Rust. A skeleton: shared types and one empty module per Go file, no logic yet"
publish = false
license = "MIT"

[dependencies]
async-trait = "0.1"
# Std and url base64 for the config path segment, the sealed-config key and the play token (Go
# `encoding/base64`). Not in the skeleton's modules yet; the owners of util.rs and seal.rs use it.
base64 = "0.22"
# Go `crypto/sha256`: the 128-bit cache-key digest `key_hash` returns (util.go), the disk tier's file
# names (diskcache.go), and HKDF-SHA256 for play tickets.
sha2 = "0.11"
# Go's `encoding/json`: `json.Marshal` for string literals in config fixtures (`jsonString`), the JSON
# text `validate_config` takes, the streamed TorBox account listing (`decodeListing`), and the response
# bodies the handler tests decode.
serde_json = "1"
# XChaCha20-Poly1305 for play tickets (Go `golang.org/x/crypto/chacha20poly1305`). The ticket owner uses it
# in production; the tests build a legacy ticket with it.
chacha20poly1305 = "0.10"
# X25519 + XSalsa20-Poly1305 for the sealed config (Go `golang.org/x/crypto/nacl/box` and `curve25519`). The same
# version den-subtitles and den-reel carry. Its `OsRng` is the Go `crypto/rand` behind the ephemeral seal key.
crypto_box = "0.9"
# BLAKE2b-192 for the seal nonce (Go `golang.org/x/crypto/blake2b`). crypto_box already depends on it.
blake2 = "0.10"
# HKDF-SHA256 for the play-ticket key (Go `crypto/hkdf`), on the sha2/hmac pair den-remux already carries.
hkdf = "0.13"
# The HTTP seam (`Doer`) takes and returns reqwest's types, so a test can build a response with
# `http::Response` and hand it over, as the Go tests do with `mockDoer`.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
# The handler serves `http::Request`/`http::Response`.
http = "1"
# Go `time.NewTicker` (`TieredCache::sweep_every`), `sync/singleflight` (indexerconfig.rs, cinemeta.rs),
# and the name lookups household sources are guarded at (sources.rs).
tokio = { version = "1", features = ["net", "sync", "time"] }
# Go `regexp` (RE2 syntax, linear time): the release-title patterns in rank.go, attributes.go and label.go.
regex = "1"
# Go `regexp2`: the patterns that need lookaround, which RE2 lacks (rank.go's "upscaled" junk pattern,
# season.go's episode matchers).
fancy-regex = "0.19"
# Go `net/url`, for the household source links in sources.go.
url = "2"

[dev-dependencies]
# Go's `t.TempDir()`.
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util", "net", "io-util"] }
