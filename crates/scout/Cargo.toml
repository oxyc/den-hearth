[package]
name = "den-scout"
version = "0.0.0"
edition = "2021"
description = "Port of den-scout's internal/scout (Go) to Rust. A skeleton: shared types and one empty module per Go file, no logic yet"
publish = false
license = "MIT"

[dependencies]
async-trait = "0.1"
# Std and url base64 for the config path segment, the sealed-config key and the play token (Go
# `encoding/base64`). Not in the skeleton's modules yet; the owners of util.rs and seal.rs use it.
base64 = "0.22"
# Go's `encoding/json`: `json.Marshal` for string literals in config fixtures (`jsonString`), the JSON
# text `validate_config` takes, the streamed TorBox account listing (`decodeListing`), and the response
# bodies the handler tests decode.
serde_json = "1"
# XChaCha20-Poly1305 for play tickets (Go `golang.org/x/crypto/chacha20poly1305`). The ticket owner uses it
# in production; the tests build a legacy ticket with it.
chacha20poly1305 = "0.10"
# The HTTP seam (`Doer`) takes and returns reqwest's types, so a test can build a response with
# `http::Response` and hand it over, as the Go tests do with `mockDoer`.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
# The handler serves `http::Request`/`http::Response`.
http = "1"
# Go `crypto/sha256`: the disk tier names an entry's file by the SHA-256 of its key.
sha2 = "0.10"
# Go `time.NewTicker`: `TieredCache::sweep_every` runs on a tokio interval and cancels by dropping the future.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# Go's `t.TempDir()`.
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util", "net", "io-util"] }
