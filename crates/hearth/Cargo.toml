[package]
name = "den-hearth"
version = "0.1.0"
edition = "2021"
description = "Den's self-hosted media node: Reel (trailers), Subtitles and Remux (HLS remux/transcode) in one process"
publish = false
license = "MIT"

[features]
# Benchmark builds only: the upstream bases come from HEARTH_STUB_* (see main.rs). Never in a shipped image.
stub-upstreams = []

[dependencies]
den-reel = { path = "../reel" }
den-subtitles = { path = "../subtitles" }
den-remux = { path = "../remux" }
den-scout = { path = "../scout" }
# The services were written for a current_thread runtime; one process serving all of them has more to
# do, so hearth runs a small multi-thread pool instead (HEARTH_WORKER_THREADS).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
# Scout's outbound client: the one the Go service built in cmd/den-scout/main.go.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-graceful"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
# Bound the kernel's TCP queues as well as Rust's buffers (see sock.rs): Linux otherwise autotunes them
# to megabytes per slow reader, charged to the container's cgroup and invisible in RSS.
socket2 = "0.6"
# Constant-time comparison of the /metrics bearer token, as in the services.
subtle = "2"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1", features = ["test-util", "io-util"] }
