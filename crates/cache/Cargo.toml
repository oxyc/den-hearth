[package]
name = "den-cache"
version = "0.0.0"
edition = "2021"
description = "The two-tier cache Scout and Subtitles share: a byte-weighted memory tier over an indexed, sparingly written disk tier"
publish = false
license = "MIT"

[dependencies]
# The memory tier: sharded and byte-weighted, so a hit does not queue behind a write and the budget is bytes.
quick_cache.workspace = true
# Entry file names (url-safe base64 of the key, or of its SHA-256).
base64.workspace = true
sha2.workspace = true
# A disk operation reached from Hearth's multi-thread runtime uses `block_in_place`: the calling
# thread finishes the indivisible cache mutation while Tokio lends its core-worker role to another
# thread. Current-thread runtimes and ordinary synchronous callers keep the direct path.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile.workspace = true
