[package]
name = "den-cache"
version = "0.0.0"
edition = "2021"
description = "The two-tier cache Scout and Subtitles share: a byte-weighted memory tier over an indexed, sparingly written disk tier"
publish = false
license = "MIT"

[dependencies]
# The memory tier: sharded and byte-weighted, so a hit does not queue behind a write and the budget is bytes.
quick_cache = "0.6"
# Entry file names (url-safe base64 of the key, or of its SHA-256).
base64 = "0.23"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
