[package]
name = "den-remux"
version = "0.47.0"
edition = "2021"
description = "Den's browser playback: the library's scout install, keyframe-cut HLS (fMP4) with the video copied and the audio copied where the browser plays it, else re-encoded to AAC (5.1 where the browser plays it)"
publish = false
license = "MIT"

[dependencies]
# Client profiles and the address guard a play URL's non-scout hops are checked with, shared with Reel, Scout and Subtitles.
den-upstream.workspace = true
# Response builders, CORS, the request log line and the metrics bearer check, shared with Reel and Subtitles.
den-http.workspace = true
# The EBML elements, ISO-BMFF boxes and codec configuration records the probe reads a file with, shared with Scout.
den-media.workspace = true
den-process.workspace = true
# The guarded signal to ffmpeg's process group, shared with Reel.
den-net.workspace = true
# Single-threaded async runtime: the process only routes requests and watches ffmpeg, which does the
# actual work in its own process. current_thread keeps the resident thread count (and RAM) minimal.
tokio = { workspace = true, features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "http1"] }
http-body-util.workspace = true
bytes.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# rustls with bundled webpki roots (ring, not aws-lc): no OpenSSL, no system CA store for our own
# requests, and it links statically on musl.
reqwest = { workspace = true, default-features = false, features = ["rustls-tls"] }
tokio-util = { workspace = true, features = ["io"] }
futures-util = { workspace = true, default-features = false, features = ["std"] }
# HMAC-SHA256 for the browser cookie and the per-session URL signature; SHA-256 for the browser keys;
# a constant-time compare for all three.
hmac = "0.13"
sha2.workspace = true
subtle.workspace = true
base64.workspace = true
getrandom = "0.4"
# XChaCha20-Poly1305 for a session's restart record in scratch (`resume`), which carries the scout install and play
# URL; the same crate scout seals its play tickets with.
chacha20poly1305.workspace = true
# Parse the first Dolby Vision RPU only for the narrowly gated malformed Profile 5 case. Keeping
# this as the library (rather than duplicating Dolby's bitstream parser) uses its validated profile verdict.
dolby_vision = { version = "3.4", default-features = false }
# Intro/credits detection (`segments`): Chromaprint's audio fingerprint in pure Rust, so the image needs no
# libchromaprint and ffmpeg needs no chromaprint muxer.
rusty-chromaprint = "0.3"

# SIGSTOP / SIGCONT for the ffmpeg process group, and the encoder's setpriority.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Forwards to the private modules' hot paths for benches/remux.rs (src/bench_api.rs). Off in every build that ships.
bench = []

[[bench]]
name = "remux"
harness = false
required-features = ["bench"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync", "test-util"] }
# Benchmarks, with an allocation-counting global allocator (`bench/micro.sh`).
divan.workspace = true
