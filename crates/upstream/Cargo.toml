[package]
name = "den-upstream"
version = "0.0.0"
edition = "2021"
description = "Outbound HTTP and upstream backoff every addon shares: named client profiles, the address guard, Retry-After and rate-limit headers, and the per-credential pause"
publish = false
license = "MIT"

[dependencies]
# The shared public-address classifier the guard judges every address with.
den-net.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
# `lookup_host`, for the guard's name checks and the dial-time resolver.
tokio = { workspace = true, features = ["net"] }
# Retry-After's HTTP-date form; hyper already builds the same dates for the Date header.
httpdate.workspace = true
# The jitter on an unstated pause.
fastrand.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time", "test-util"] }
