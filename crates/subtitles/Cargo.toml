[package]
name = "den-subtitles"
version = "0.24.7"
edition = "2021"
description = "Den subtitles, one container: Stremio subtitles addon that fetches (OpenSubtitles, hash-matched), AI-translates (BYOK), and auto-syncs SRTs for the Den Apple TV app"
publish = false
license = "MIT"

[dependencies]
# The public-address classifier resync hops are vetted with, shared with Scout and Remux.
den-net.workspace = true
# Response builders, conditional GETs, CORS, the request log line and the metrics bearer check, shared with Reel and Remux.
den-http.workspace = true
# Client profiles, the address guard, Retry-After and the per-credential pause, shared with Reel, Remux and Scout.
den-upstream.workspace = true
# The two-tier artifact cache, shared with Scout.
den-cache.workspace = true
# Kill complete alass/ffmpeg process groups when a request times out or is cancelled.
den-process.workspace = true
# current_thread async runtime — this is an I/O-bound proxy; the CPU work lives in the
# alass/ffmpeg subprocesses and the LLM APIs, not here. Keeps homelab idle RAM minimal.
tokio = { workspace = true, features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "http1"] }
http-body-util.workspace = true
bytes.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# rustls (not OpenSSL) with bundled webpki roots → no ca-certificates juggling, static-friendly TLS.
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-util = { workspace = true, features = ["io"] }
futures-util = { workspace = true, default-features = false, features = ["std", "async-await"] }
base64.workspace = true
# The sealed-config keyring and the install-revocation policy, shared with Scout and Reel.
den-seal.workspace = true
# Subtitle files are whatever encoding the uploader's editor saved (Windows-1250/1251, ISO-8859-x,
# UTF-16), and the player downstream drops any cue that is not UTF-8. chardetng guesses the legacy
# encoding the way Firefox does for unlabeled pages; encoding_rs decodes it.
chardetng = "1"
encoding_rs = "0.8"

[features]
# Forwards to the private modules' hot paths for benches/subtitles.rs (src/bench_api.rs). Off in every build that ships.
bench = []

[[bench]]
name = "subtitles"
harness = false
required-features = ["bench"]

[[bench]]
name = "cache_replay"
harness = false
required-features = ["bench"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync", "test-util"] }
# Benchmarks, with an allocation-counting global allocator (`bench/micro.sh`).
divan.workspace = true
tempfile.workspace = true
