[package]
name = "den-subtitles"
version = "0.24.7"
edition = "2021"
description = "Den subtitles, one container: Stremio subtitles addon that fetches (OpenSubtitles, hash-matched), AI-translates (BYOK), and auto-syncs SRTs for the Den Apple TV app"
publish = false
license = "MIT"

[dependencies]
# The public-address classifier resync hops are vetted with, shared with Scout and Remux.
den-net = { path = "../net" }
# current_thread async runtime — this is an I/O-bound proxy; the CPU work lives in the
# alass/ffmpeg subprocesses and the LLM APIs, not here. Keeps homelab idle RAM minimal.
tokio = { version = "1", features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (not OpenSSL) with bundled webpki roots → no ca-certificates juggling, static-friendly TLS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
base64 = "0.23"
# Sealed config-in-URL (docs mirror of den-scout/docs/SEALED-CONFIG.md): decrypt a config sealed to
# the addon's X25519 key. `seal` = libsodium crypto_box_seal (X25519 + XSalsa20-Poly1305, blake2b nonce),
# byte-compatible with the Go addon + the browser bundle. Decrypt-only here → no rng needed.
crypto_box = { version = "0.9", features = ["seal"] }
# Constant-time comparison of the /metrics bearer token. Already in the tree under crypto_box.
subtle = "2"
# Subtitle files are whatever encoding the uploader's editor saved (Windows-1250/1251, ISO-8859-x,
# UTF-16), and the player downstream drops any cue that is not UTF-8. chardetng guesses the legacy
# encoding the way Firefox does for unlabeled pages; encoding_rs decodes it.
chardetng = "1"
encoding_rs = "0.8"

[features]
# Forwards to the private modules' hot paths for benches/subtitles.rs (src/bench_api.rs). Off in every build that ships.
bench = []

[[bench]]
name = "subtitles"
harness = false
required-features = ["bench"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync", "test-util"] }
# Benchmarks, with an allocation-counting global allocator (`bench/micro.sh`).
divan = "0.1"
tempfile = "3"
