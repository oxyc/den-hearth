[package]
name = "den-http"
version = "0.0.0"
edition = "2021"
description = "The HTTP and log plumbing every addon answers with: one body type, JSON/error builders, conditional GETs, CORS, the request log line and what it may show, Prometheus text"
publish = false
license = "MIT"

# Built on the `http` types and nothing else from hyper, so Scout (which serves `http::Request`) can use the pure
# helpers without taking a server.
[dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# HTTP dates for If-Modified-Since and If-Range.
httpdate.workspace = true
# Constant-time comparison of the /metrics bearer token.
subtle.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
