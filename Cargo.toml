[workspace]
resolver = "2"
members = ["crates/*"]

# Versions shared across members live here; each crate keeps its own feature selection beside the code that needs it.
[workspace.dependencies]
base64 = "0.23"
async-trait = "0.1"
blake2 = "0.10"
bytes = "1"
chacha20poly1305 = "0.11"
crypto_box = "0.9"
divan = "0.1"
fastrand = "2"
getrandom = "0.4"
flate2 = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false }
hkdf = "0.13"
http = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = "1"
hyper-util = "0.1"
libc = "0.2"
quick_cache = "0.6"
reqwest = { version = "0.12", default-features = false }
serde = "1"
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
tokio = "1"
tokio-util = "0.7"

den-cache = { path = "crates/cache" }
den-http = { path = "crates/http" }
den-media = { path = "crates/media" }
den-net = { path = "crates/net" }
den-process = { path = "crates/process" }
den-seal = { path = "crates/seal" }
den-upstream = { path = "crates/upstream" }

# Line tables are all a panic backtrace needs; dropping variable-level DWARF cuts the clean build's CPU time by
# about a fifth (BENCHMARKS.md, "Test-suite speed"). Attach a debugger with `--config profile.dev.debug=2`.
[profile.dev]
debug = "line-tables-only"

# The regex engines and serde_json run the multi-megabyte-title tests (scout's lookaround and episode patterns,
# the account-listing decoders); unoptimised they dominate the suite. Dependencies only, so the crates under test
# keep debug assertions and overflow checks, and a dependency is built once, not on every incremental rebuild.
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

# Self-contained binaries for a resource-constrained homelab. opt-level 3 (speed): the serve/stream
# path wants the fast codegen (time-to-first-frame). Fat LTO + one codegen unit + strip keep it small.
# panic=unwind (the default): a panic in one request task unwinds just that connection (tokio catches
# it) instead of aborting the whole server. The same profile den-reel, den-subtitles and den-remux
# each carried in their own manifest before the workspace took it over.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
